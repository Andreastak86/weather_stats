<!DOCTYPE html>
<html lang="no">
    <head>
        <meta charset="UTF-8" />
        <title>Værdashboard 2024</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <h1>Værdashboard 2024</h1>
            <p>Statistikk fra din egen CSV-logg</p>
        </header>

        <main>
            <section class="cards">
                <div class="card">
                    <h2>Totalt antall dager</h2>
                    <p id="total-days">–</p>
                </div>
                <div class="card">
                    <h2>Snittemperatur</h2>
                    <p id="avg-temp">–</p>
                </div>
                <div class="card">
                    <h2>Varmeste dag</h2>
                    <p id="warmest">–</p>
                </div>
                <div class="card">
                    <h2>Kaldeste dag</h2>
                    <p id="coldest">–</p>
                </div>
            </section>

            <section>
                <h2>Værforhold (antall dager)</h2>
                <ul id="conditions-list"></ul>
            </section>

            <section>
                <h2>Alle dager</h2>

                <div class="filter-row">
                    <label for="month-filter">Vis måned:</label>
                    <select id="month-filter">
                        <option value="0">Januar</option>
                        <option value="1">Februar</option>
                        <option value="2">Mars</option>
                        <option value="3">April</option>
                        <option value="4">Mai</option>
                        <option value="5">Juni</option>
                        <option value="6">Juli</option>
                        <option value="7">August</option>
                        <option value="8">September</option>
                        <option value="9">Oktober</option>
                        <option value="10">November</option>
                        <option value="11">Desember</option>
                    </select>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Dato</th>
                            <th>Temp (°C)</th>
                            <th>Vær</th>
                            <th>Vind</th>
                            <th>Vind (m/s)</th>
                        </tr>
                    </thead>
                    <tbody id="daily-table-body"></tbody>
                </table>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
